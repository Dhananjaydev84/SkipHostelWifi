<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Main stylesheet for the popup UI -->
  <link rel="stylesheet" href="style3.css">
  <title>SkipHostelWifi</title>
</head>

<body>
  <!-- Root container — flex column: card + footer -->
  <div id="popup-root" class="app">

    <!-- Main card: holds the header + form content -->
    <main class="card">

      <!-- Top bar: branding -->
      <header class="top-bar">
        <!-- Branding: logo image + subtitle text -->
        <div class="brand">
          <div class="title">
            <img class="title-logo" src="images/Main logo2.png" alt="Skip Hostel Wifi">
          </div>
          <div class="subtitle">Auto login for hostel &amp; campus WiFi</div>
        </div>
      </header>

      <!-- Main form: UID input + Connect button + status feedback -->
      <section class="content">

        <!-- User ID input field -->
        <label class="field">
          <span class="label">User ID</span>
          <input id="uid" type="text" placeholder="Enter User ID" autocomplete="off">
        </label>

        <!-- Action buttons row -->
        <div class="actions">
          <button id="submit" class="primary" type="button"><span>Connect</span></button>
        </div>

        <!-- Login status message (e.g. "Connecting…", "Connected successfully!") -->
        <div id="output" class="status"></div>

        <!-- Keep-alive background status (fades in after keep-alive acknowledges) -->
        <p id="keepAliveStatus" class="keep-alive-status"></p>
      </section>
    </main>

    <!-- Footer: credits + version badge -->
    <footer class="footer">
      <span class="footer-credits">
        <span class="footer-text">Built by</span>
        <a href="https://www.linkedin.com/in/dhananjay-dev-204b72292/" target="_blank" rel="noreferrer">Dhananjay Dev</a>
        <span class="footer-text">&amp; </span>
        <a href="https://www.linkedin.com/in/arjun-satheesh-382377390/" target="_blank" rel="noreferrer">Arjun
          Satheesh</a>
      </span>
      <span id="versionBadge" class="footer-text footer-version"></span>
    </footer>
  </div>

  <!-- popup.js — UI-only logic; login is delegated to background.js -->
  <script src="popup.js"></script>
</body>

</html>
